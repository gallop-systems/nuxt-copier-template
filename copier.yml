_subdirectory: template
_templates_suffix: .jinja
_skip_if_exists:
  - ".env"
  # An app owns its app.config.ts (gallopUi.pt, its looks). The template writes
  # it only into a new app; `copier update` never touches an existing one.
  - "app/app.config.ts"
  # The same for the two files every app edits first: its token block and colours
  # (main.css) and its header. They keep conflicting in `copier update`, so they are
  # written into a new app and left alone afterwards. A template change to either is
  # announced in the release notes to copy by hand.
  - "app/assets/css/main.css"
  - "app/components/AppHeader.vue"
# Copier's defaults come first: setting _exclude replaces them.
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # New projects use gallop-ui's SegmentedControl instead. Existing apps keep
  # their SlidingTabs through updates until they adopt the layer and delete it.
  # (_copier_operation is set here but not in file names, hence not a
  # conditional file name like lefthook.yml's.)
  - "{% if _copier_operation == 'copy' %}app/components/SlidingTabs.vue{% endif %}"

# Questions
project_name:
  type: str
  help: "Project name (used for package.json, DB names, etc.)"
  validator: "{% if not project_name %}project_name is required{% endif %}"

project_description:
  type: str
  help: "Project description for package.json"
  default: ""

database_name:
  type: str
  help: "PostgreSQL database name"
  default: "{{ project_name }}"

auth_provider:
  type: str
  help: "Which auth provider should the app scaffold? (google / microsoft / none)"
  choices:
    Google OAuth: google
    Microsoft OAuth (Entra ID): microsoft
    None (session infra + preview login only): none
  # Migrates existing repos on `copier update`: the old bool answer is still in
  # context (true -> google, false -> none); fresh copies default to google.
  default: "{{ 'google' if include_google_oauth | default(true) else 'none' }}"

time_zone:
  type: str
  help: "The app's time zone (IANA name, e.g. America/New_York). Times show in it, on the server and in the browser, via gallopUi.timeZone"
  default: "America/New_York"
  validator: "{% if not (time_zone | regex_search('^[A-Za-z]+(/[A-Za-z0-9_+-]+){0,2}$')) %}Use an IANA time zone name such as America/New_York{% endif %}"

include_ci:
  type: bool
  help: "Include GitHub Actions CI workflow?"
  default: true

include_git_hooks:
  type: bool
  help: "Include lefthook git hooks?"
  default: true

include_renovate:
  type: bool
  help: "Include Renovate config so this repo keeps its own dependencies fresh?"
  default: true

# Post-generation tasks
_tasks:
  # Create databases
  - command: "createdb {{ database_name }}"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "createdb {{ database_name }}-test"
    when: "{{ _copier_operation == 'copy' }}"
  # Create .env from example
  - command: "cp .env.example .env"
    when: "{{ _copier_operation == 'copy' }}"
  # Install dependencies (skip builds to avoid nuxt prepare before env is ready)
  - command: "yarn install"
    when: "{{ _copier_operation == 'copy' }}"
  # Create and populate users migration
  - command: "yarn db:migrate:make create_users_table"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "node scripts/populate-initial-migration.mjs"
    when: "{{ _copier_operation == 'copy' }}"
  # Run migration and generate types
  - command: "bash -c 'set -a && source .env && set +a && yarn db:migrate'"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "bash -c 'set -a && source .env && set +a && yarn db:codegen'"
    when: "{{ _copier_operation == 'copy' }}"
  # Seed the anchor login user (enables preview/dev login)
  - command: "bash -c 'set -a && source .env && set +a && yarn db:seed'"
    when: "{{ _copier_operation == 'copy' }}"
  # Initialize git repo (must come before lefthook install)
  - command: "git init && git add -A && git commit -m 'Initial scaffold from gallop-template'"
    when: "{{ _copier_operation == 'copy' }}"
  # Add gallop-ui, the shared UI layer, as a git subtree at layers/gallop-ui (its
  # own commit). Needs read access to gallop-systems/gallop-ui; without it the
  # scaffold carries on, and `yarn ui:add` adds it later.
  - command: "node scripts/gallop-ui.mjs add || echo 'Could not add gallop-ui (no access?). Run: yarn ui:add'"
    when: "{{ _copier_operation == 'copy' }}"
  # Install lefthook (conditional, requires git repo)
  - command: "npx lefthook install"
    when: "{{ _copier_operation == 'copy' and include_git_hooks }}"
